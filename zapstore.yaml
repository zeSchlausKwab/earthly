name: Earthly
summary: Collaborative maps built on Nostr
description: |
  Earthly is a touch-first collaborative mapping app for creating, discussing,
  and sharing geographic datasets over Nostr.

  Draw points, lines, and polygons; publish versioned GeoJSON datasets; annotate
  maps with geographic comments; and work in MLS-encrypted Private groups.
  Android Field sessions add explicit nearby-only collaboration over a shared
  Wi-Fi network or hotspot, including chat, map editing, and one-time mirroring
  of referenced map files for offline use.

  Earthly includes its own local relay and Blossom service. Core nearby and
  offline workflows do not require a separate companion relay app.

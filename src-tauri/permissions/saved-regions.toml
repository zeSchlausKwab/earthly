[[permission]]
identifier = "saved-regions"
description = "Allows the Earthly main window to save, hydrate, download, resume, cancel, and remove verified offline map regions."
commands.allow = [
  "saved_region_create_v1",
  "saved_region_list_v1",
  "saved_region_events_v1",
  "saved_region_retain_deletions_v1",
  "saved_region_download_v1",
  "saved_region_cancel_v1",
  "saved_region_remove_v1",
  "saved_region_repair_v1",
  "saved_region_collect_garbage_v1",
]

[package]
name = "earthly-desktop"
version = "0.1.0"
description = "Earthly native application shell"
authors = ["Earthly contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
publish = false

[lib]
name = "earthly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
earthly-local-node = { path = "../crates/earthly-local-node" }
if-addrs = "0.14"
nostr = "0.44.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-os = "2.3.2"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }

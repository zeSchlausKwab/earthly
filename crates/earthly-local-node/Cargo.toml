[package]
name = "earthly-local-node"
version = "0.1.0"
description = "Reusable embedded Nostr relay and Blossom node for local-first applications"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
publish = false

[dependencies]
axum = "0.8"
base64 = "0.22"
flate2 = "1.1.9"
fs2 = "0.4"
futures-util = "0.3"
infer = "0.19"
mime_guess = "2"
nostr = "0.44.1"
nostr-database = "0.44.0"
nostr-lmdb = "0.44.1"
nostr-relay-builder = "0.44.1"
nostr-sdk = "0.44.1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

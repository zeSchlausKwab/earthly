[package]
name = "earthly-geo"
version = "0.1.0"
description = "Pure-Rust geospatial kernel for Earthly (validation, measurement, snapping, boolean ops, corridor/arrow extrusion, simplify, split) targeting native and wasm32"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
publish = false

[dependencies]
earthly-spatial = { path = "../earthly-spatial" }
flate2 = "1"
geo = "0.29"
geojson = "0.24"
quick-xml = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

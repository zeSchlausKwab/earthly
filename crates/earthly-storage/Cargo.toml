[package]
name = "earthly-storage"
version = "0.1.0"
description = "Tauri-independent SQLite storage primitives for Earthly (durable publish outbox and account sessions)"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
nostr = "0.44.1"
rand = "0.8"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

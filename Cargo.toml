[workspace]
members = [
  "crates/earthly-agent",
  "crates/earthly-domain",
  "crates/earthly-ffi",
  "crates/earthly-geo",
  "crates/earthly-local-node",
  "crates/earthly-mls",
  "crates/earthly-spatial",
  "crates/earthly-storage",
  "crates/earthly-wasm",
]
exclude = ["crates/nostr-relay-builder"]
resolver = "2"

[patch.crates-io]
nostr-relay-builder = { path = "crates/nostr-relay-builder" }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"

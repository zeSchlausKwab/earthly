<!-- @dsCard group="Colors" viewport="700x140" subtitle="Cool graphite — the tool theme is dark-first" name="Dark neutrals" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:16px;background:var(--surface-app);font-family:var(--font-ui)}
  .row{display:flex;border:1px solid var(--border-strong);border-radius:var(--r-1);overflow:hidden}
  .sw{flex:1;height:56px}
  .labels{display:flex;margin-top:6px}
  .labels span{flex:1;font-family:var(--font-mono);font-size:9px;color:var(--text-faint);text-align:center}
</style></head><body>
  <div class="row">
    <div class="sw" style="background:var(--n-chrome)"></div>
    <div class="sw" style="background:var(--n-bg)"></div>
    <div class="sw" style="background:var(--n-sunken)"></div>
    <div class="sw" style="background:var(--n-panel-2)"></div>
    <div class="sw" style="background:var(--n-panel)"></div>
    <div class="sw" style="background:var(--n-raised)"></div>
    <div class="sw" style="background:var(--n-border)"></div>
    <div class="sw" style="background:var(--n-line)"></div>
    <div class="sw" style="background:var(--n-muted)"></div>
    <div class="sw" style="background:var(--n-text)"></div>
    <div class="sw" style="background:var(--n-text-hi)"></div>
  </div>
  <div class="labels">
    <span>chrome</span><span>bg</span><span>sunken</span><span>panel2</span><span>panel</span><span>raised</span><span>border</span><span>line</span><span>muted</span><span>text</span><span>text-hi</span>
  </div>
</body></html>

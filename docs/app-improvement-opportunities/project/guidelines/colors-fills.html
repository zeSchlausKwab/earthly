<!-- @dsCard group="Colors" viewport="700x120" subtitle="Tinted fills mark selection & the edit/draft mode" name="State fills" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:16px;background:var(--surface-app);font-family:var(--font-ui)}
  .rows{display:flex;flex-direction:column;gap:6px}
  .r{height:30px;display:flex;align-items:center;padding:0 10px;border-radius:var(--r-1);font-size:12px;color:var(--text-body)}
  .r .k{font-family:var(--font-mono);font-size:9px;color:var(--text-faint);margin-left:auto}
</style></head><body>
  <div class="rows">
    <div class="r" style="background:var(--fill-active-14);border-left:2px solid var(--accent-active)">Selected row<span class="k">fill-active-14 + 2px amber</span></div>
    <div class="r" style="background:var(--fill-active-08)">Hover / soft-selected<span class="k">fill-active-08</span></div>
    <div class="r" style="background:var(--fill-edit-06);border-left:2px solid var(--accent-edit)">Editing block<span class="k">fill-edit-06 + 2px violet</span></div>
  </div>
</body></html>

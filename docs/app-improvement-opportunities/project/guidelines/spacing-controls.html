<!-- @dsCard group="Spacing" viewport="700x120" subtitle="22 / 26 / 30px — every control is compact" name="Control sizes" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:18px;background:var(--surface-app);font-family:var(--font-ui)}
  .row{display:flex;align-items:center;gap:14px}
  .btn{display:inline-flex;align-items:center;padding:0 12px;border-radius:var(--r-1);background:var(--accent-active);color:var(--accent-ink);font-weight:600;font-size:12px;border:none}
  .m{font-family:var(--font-mono);font-size:9px;color:var(--text-faint);margin-left:4px}
</style></head><body>
  <div class="row">
    <button class="btn" style="height:22px;font-size:11px">Small</button><span class="m">22 · sm</span>
    <button class="btn" style="height:26px">Medium</button><span class="m">26 · md (default)</span>
    <button class="btn" style="height:30px">Large</button><span class="m">30 · lg</span>
  </div>
</body></html>

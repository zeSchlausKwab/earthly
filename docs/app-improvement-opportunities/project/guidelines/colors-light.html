<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:16px;background:#e4e2de;font-family:var(--font-ui)}
  .row{display:flex;border:1px solid #c8c6c1;border-radius:2px;overflow:hidden}
  .sw{flex:1;height:56px}
  .labels{display:flex;margin-top:6px}
  .labels span{flex:1;font-family:var(--font-mono);font-size:9px;color:#8a887f;text-align:center}
</style></head><body>
  <div class="row">
    <div class="sw" style="background:var(--l-bg)"></div>
    <div class="sw" style="background:var(--l-panel)"></div>
    <div class="sw" style="background:var(--l-card)"></div>
    <div class="sw" style="background:var(--l-border)"></div>
    <div class="sw" style="background:var(--l-line)"></div>
    <div class="sw" style="background:var(--l-muted)"></div>
    <div class="sw" style="background:var(--l-text)"></div>
  </div>
  <div class="labels">
    <span>bg</span><span>panel</span><span>card</span><span>border</span><span>line</span><span>muted</span><span>text</span>
  </div>
</body></html>

<!-- @dsCard group="Brand" viewport="700x150" subtitle="Borders do the work shadows used to" name="Elevation" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--surface-app);font-family:var(--font-ui);display:flex;gap:22px;align-items:center}
  .cell{display:flex;flex-direction:column;gap:8px;align-items:center}
  .box{width:150px;height:64px;background:var(--surface-panel);border:1px solid var(--border-hairline);border-radius:var(--r-2);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-muted)}
  .m{font-family:var(--font-mono);font-size:9px;color:var(--text-faint)}
</style></head><body>
  <div class="cell"><div class="box">Docked panel</div><span class="m">hairline · no shadow</span></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-panel)">Floating panel</div><span class="m">shadow-panel</span></div>
  <div class="cell"><div class="box" style="background:var(--surface-raised);border-color:var(--border-strong);box-shadow:var(--shadow-pop)">Menu / popover</div><span class="m">shadow-pop</span></div>
</body></html>

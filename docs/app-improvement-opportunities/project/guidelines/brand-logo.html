<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--surface-app);font-family:var(--font-ui);display:flex;gap:40px;align-items:center}
  .lockup{display:flex;align-items:center;gap:12px}
  .mark{width:40px;height:40px;border-radius:6px;overflow:hidden;box-shadow:2px 2px 0 0 rgba(0,0,0,.3)}
  .mark img{width:100%;height:100%;display:block}
  .wm{font-family:var(--font-display);font-weight:800;font-size:28px;color:var(--text-primary)}
  .chip{width:24px;height:24px;border-radius:5px;background:var(--accent-active);display:flex;align-items:center;justify-content:center}
  .m{font-family:var(--font-mono);font-size:9px;color:var(--text-faint);margin-top:8px}
</style></head><body>
  <div style="display:flex;flex-direction:column">
    <div class="lockup"><div class="mark"><img src="../assets/earthly-mark.png" alt="Earthly"></div><span class="wm">Earthly</span></div>
    <span class="m">primary lockup · mark from base-assets</span>
  </div>
  <div style="display:flex;flex-direction:column">
    <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-ink)" stroke-width="2.4" style="width:15px;height:15px"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20"/></svg></div>
    <span class="m">amber glyph · toolbar</span>
  </div>
</body></html>

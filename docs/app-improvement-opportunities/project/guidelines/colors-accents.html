<!-- @dsCard group="Colors" viewport="700x150" subtitle="Scarce, one job each — amber is brand + selection" name="Accents" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:16px;background:var(--surface-app);font-family:var(--font-ui)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .cell{display:flex;flex-direction:column;gap:5px}
  .sw{height:48px;border-radius:var(--r-1);border:1px solid rgba(255,255,255,.08)}
  .nm{font-size:11px;color:var(--text-body);font-weight:600}
  .use{font-family:var(--font-mono);font-size:9px;color:var(--text-faint)}
</style></head><body>
  <div class="grid">
    <div class="cell"><div class="sw" style="background:var(--a-amber)"></div><span class="nm">Amber</span><span class="use">active · selection</span></div>
    <div class="cell"><div class="sw" style="background:var(--a-cyan)"></div><span class="nm">Cyan</span><span class="use">info · reference</span></div>
    <div class="cell"><div class="sw" style="background:var(--a-green)"></div><span class="nm">Green</span><span class="use">ok · live · valid</span></div>
    <div class="cell"><div class="sw" style="background:var(--a-red)"></div><span class="nm">Red</span><span class="use">danger · expiring</span></div>
    <div class="cell"><div class="sw" style="background:var(--a-violet)"></div><span class="nm">Violet</span><span class="use">edit · draft mode</span></div>
  </div>
</body></html>

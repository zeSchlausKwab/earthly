<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:18px;background:var(--surface-app);font-family:var(--font-ui);color:var(--text-body)}
  .stack{display:flex;flex-direction:column;gap:10px}
  .item{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--border-hairline);padding-bottom:8px}
  .item .m{font-family:var(--font-mono);font-size:9px;color:var(--text-faint)}
</style></head><body>
  <div class="stack">
    <div class="item"><span style="font-size:19px;font-weight:600;color:var(--text-primary)">Section header</span><span class="m">h4 · 19 / 600</span></div>
    <div class="item"><span style="font-size:15px;font-weight:600">Panel title</span><span class="m">title · 15 / 600</span></div>
    <div class="item"><span style="font-size:13px;font-weight:600">Row label / emphasis</span><span class="m">label · 13 / 600</span></div>
    <div class="item"><span style="font-size:12px">Body &amp; controls</span><span class="m">body · 12 / 400</span></div>
    <div class="item"><span style="font-size:11px;color:var(--text-muted)">Meta, hints, captions</span><span class="m">meta · 11 / 400</span></div>
    <div class="item"><span style="font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)">Group label</span><span class="m">caps · 9 mono</span></div>
  </div>
</body></html>

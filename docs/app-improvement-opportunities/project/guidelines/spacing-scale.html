<!-- @dsCard group="Spacing" viewport="700x120" subtitle="2·4·6·8·12·24 — tight by default" name="Spacing scale" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:18px;background:var(--surface-app);font-family:var(--font-ui)}
  .row{display:flex;align-items:flex-end;gap:18px}
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px}
  .bar{background:var(--accent-active);border-radius:var(--r-1)}
  .m{font-family:var(--font-mono);font-size:9px;color:var(--text-faint)}
</style></head><body>
  <div class="row">
    <div class="cell"><div class="bar" style="width:2px;height:16px"></div><span class="m">2</span></div>
    <div class="cell"><div class="bar" style="width:4px;height:24px"></div><span class="m">4</span></div>
    <div class="cell"><div class="bar" style="width:6px;height:32px"></div><span class="m">6</span></div>
    <div class="cell"><div class="bar" style="width:8px;height:44px"></div><span class="m">8</span></div>
    <div class="cell"><div class="bar" style="width:12px;height:56px"></div><span class="m">12</span></div>
    <div class="cell"><div class="bar" style="width:24px;height:72px"></div><span class="m">24</span></div>
  </div>
</body></html>

name: TypeScript regression check

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun test scripts/typecheck-baseline.test.ts
      - run: bun run typecheck
